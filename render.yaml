# Render Blueprint: the API on a free web service (the worker runs inside it). The database is Neon, the frontend is Vercel.
services:
  - type: web
    name: copilot-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ENVIRONMENT
        value: production
      - key: RUN_WORKER_IN_API
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL   # Neon connection string, starting postgresql+psycopg://
        sync: false
      - key: FRONTEND_ORIGIN   # your Vercel URL, e.g. https://your-app.vercel.app
        sync: false
