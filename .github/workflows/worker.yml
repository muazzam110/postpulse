# Free alternative to an always-on worker: every 5 minutes, run one poll and exit.
# Add the repository secret DATABASE_URL (Settings > Secrets and variables > Actions).
# GitHub may delay scheduled runs by several minutes, and pauses schedules after 60 days without repo activity.
name: reminder-worker
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
concurrency: { group: reminder-worker, cancel-in-progress: false }
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - run: python -m app.worker.main --once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENVIRONMENT: production
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
