<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Turn what you build into LinkedIn posts that sound like you." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Growth Copilot</title>
    <script>
      // Set the theme before first paint to avoid a flash. Only a UI preference is read here, never credentials.
      try {
        var t = localStorage.getItem("gc-theme") || "system";
        if (t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
